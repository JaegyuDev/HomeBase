plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "${runPaperVersion}"
    id("com.gradleup.shadow") version "${shadowVersion}"
}

group = 'dev.jaegyu'
version = pluginVersion

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:${paperApiVersion}")
    implementation("com.electronwill.night-config:toml:${nightConfigVersion}")
}

tasks {
    runServer {
        minecraftVersion(project.minecraftVersion)
    }

    shadowJar {
        relocate 'com.electronwill.nightconfig', 'dev.jaegyu.homeBase'
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion as int)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if ((targetJavaVersion as int) >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion as int)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}